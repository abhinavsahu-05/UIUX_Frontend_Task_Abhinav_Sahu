<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DroneTV - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <div class="logo-box">
                <span>DroneTV</span>
            </div>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="services.html">Services</a>
                <a href="courses.html">Courses</a>
                <a href="products.html">Products</a>
                <a href="login.html" class="active login-btn">Signup</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="section-container center-auth-section">
            <div class="auth-card">
                <div class="auth-header">
                    <h2>Welcome Back</h2>
                    <p>Sign in to access account.</p>
                </div>
                
                <form id="loginForm" action="dashboard.html" method="GET">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="emailInput" placeholder="" required class="custom-input">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="passwordInput" placeholder="" required class="custom-input">
                    </div>
                    <button type="submit" class="btn-green-block">Sign In</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-flex">
            <div>
                <p class="footer-title">Social media</p>
                <p>&copy; 2026 DroneTV. All rights reserved.</p>
                <p>Contact us</p>
            </div>
            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <span>|</span>
                <a href="#">Terms of Service</a>
            </div>
        </div>
    </footer>

    <script src="Javascript/script.js"></script>
</body>
</html>
